apiVersion: v1
kind: Service
metadata:
  name: onos-ctrl
spec:
  type: NodePort
  selector:
    app: onos
  ports:
    - name: gui
      port: 8181
      targetPort: 8181
      nodePort: 30181
    - name: cli
      port: 8101
      targetPort: 8101
      nodePort: 30101
    - name: openflow
      port: 6653
      targetPort: 6653
      nodePort: 30653
