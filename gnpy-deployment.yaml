apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnpy-pce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gnpy
  template:
    metadata:
      labels:
        app: gnpy
    spec:
      containers:
      - name: gnpy
        image: telecominfraproject/gnpy:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gnpy-api
spec:
  selector:
    app: gnpy
  ports:
    - port: 8080
      targetPort: 8080
